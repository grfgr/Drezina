// Скелет и анимации дрезины.
// Имена selections и memory-точек должны совпадать с теми, что создаёт tools/blender/make_models.py.
//
//   selections (Resolution LOD 0, Geometry не нужно анимировать):
//     lever        - коромысло с ручками
//     wheel_fl, wheel_fr, wheel_rl, wheel_rr - колёса
//   memory LOD:
//     lever_axis   - 2 точки на оси качания коромысла (поперёк дрезины)
//     axle_front   - 2 точки на передней оси
//     axle_rear    - 2 точки на задней оси
//     seat_driver  - где стоит игрок (используется скриптом как подсказка)

class CfgSkeletons
{
	// мотодрезина: кости экипажа (прокси crewDriver/crewCargo1/crewCargo2 в View Geometry) и колёса
	class Drezina_Motor_Skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[] =
		{
			"crewDriver", "",
			"crewCargo1", "",
			"crewCargo2", "",
			"crewCargo3", "",
			"crewCargo4", "",
			"crewCargo5", "",
			"crewCargo6", "",
			"wheel_1_1", "",
			"wheel_2_1", "",
			"wheel_1_2", "",
			"wheel_2_2", "",
			"wheel_1_3", "",
			"wheel_2_3", "",
			"module_bench", "",
			"module_barrels", ""
		};
	};

	// прицепы: 4 пассажира и колёса
	class Drezina_Trailer_Skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[] =
		{
			"crewCargo1", "",
			"crewCargo2", "",
			"crewCargo3", "",
			"crewCargo4", "",
			"wheel_1_1", "",
			"wheel_2_1", "",
			"wheel_1_2", "",
			"wheel_2_2", ""
		};
	};

	class Drezina_Handcar_Skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[] =
		{
			"lever",    "",
			"wheel_fl", "",
			"wheel_fr", "",
			"wheel_rl", "",
			"wheel_rr", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class handcar: Default
	{
		skeletonName = "Drezina_Handcar_Skeleton";
		sections[] = {};

		class Animations
		{
			// Коромысло качается на +-22 градуса вокруг поперечной оси.
			class drezina_lever_rot
			{
				type = "rotation";
				source = "drezina_lever";
				selection = "lever";
				axis = "lever_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -22";
				angle1 = "rad 22";
			};

			class wheel_fl_rot
			{
				type = "rotation";
				source = "drezina_wheels";
				selection = "wheel_fl";
				axis = "axle_front";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 360";
			};
			class wheel_fr_rot: wheel_fl_rot
			{
				selection = "wheel_fr";
			};
			class wheel_rl_rot: wheel_fl_rot
			{
				selection = "wheel_rl";
				axis = "axle_rear";
			};
			class wheel_rr_rot: wheel_rl_rot
			{
				selection = "wheel_rr";
			};
		};
	};

	class motor_handcar: Default
	{
		skeletonName = "Drezina_Motor_Skeleton";
		sections[] = {"light_left", "light_right", "light_brake_1_2", "light_brake_2_2", "light_reverse_1_2", "light_reverse_2_2", "light_1_2", "light_2_2", "light_dashboard"};

		class Animations
		{
			// колёса крутит скрипт (по скорости вдоль пути), фаза 0..1 = один оборот
			class wheel_1_1_rot
			{
				type = "rotation";
				source = "drezina_wheels";
				selection = "wheel_1_1";
				axis = "axle_front";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 360";
			};
			class wheel_2_1_rot: wheel_1_1_rot
			{
				selection = "wheel_2_1";
			};
			class wheel_1_2_rot: wheel_1_1_rot
			{
				selection = "wheel_1_2";
				axis = "axle_rear";
			};
			class wheel_2_2_rot: wheel_1_2_rot
			{
				selection = "wheel_2_2";
			};
			// третья (задняя) ось
			class wheel_1_3_rot: wheel_1_1_rot
			{
				selection = "wheel_1_3";
				axis = "axle_third";
			};
			class wheel_2_3_rot: wheel_1_3_rot
			{
				selection = "wheel_2_3";
			};
			// модули: фаза 1 — спрятан
			class module_bench_hide
			{
				type = "hide";
				source = "module_bench";
				selection = "module_bench";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
			class module_barrels_hide: module_bench_hide
			{
				source = "module_barrels";
				selection = "module_barrels";
			};
		};
	};

	class trailer_passenger: motor_handcar
	{
		skeletonName = "Drezina_Trailer_Skeleton";
	};
	class trailer_cargo: trailer_passenger {};
	class trailer_passenger_vis: trailer_passenger {};
	class trailer_cargo_vis: trailer_passenger {};

	class rail_2m: Default {};
	class dispenser: Default {};
	class tunnel_lamp: Default
	{
		sections[] = {"glass"};
	};
};
