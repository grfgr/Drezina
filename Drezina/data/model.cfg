// Скелет и анимации дрезины.
// Имена selections и memory-точек должны совпадать с теми, что создаёт tools/blender/make_models.py.
//
//   selections (Resolution LOD 0, Geometry не нужно анимировать):
//     lever        - коромысло с ручками
//     wheel_fl, wheel_fr, wheel_rl, wheel_rr - колёса
//   memory LOD:
//     lever_axis   - 2 точки на оси качания коромысла (поперёк дрезины)
//     axle_front   - 2 точки на передней оси
//     axle_rear    - 2 точки на задней оси
//     seat_driver  - где стоит игрок (используется скриптом как подсказка)

class CfgSkeletons
{
	class Drezina_Handcar_Skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[] =
		{
			"lever",    "",
			"wheel_fl", "",
			"wheel_fr", "",
			"wheel_rl", "",
			"wheel_rr", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class handcar: Default
	{
		skeletonName = "Drezina_Handcar_Skeleton";
		sections[] = {};

		class Animations
		{
			// Коромысло качается на +-22 градуса вокруг поперечной оси.
			class drezina_lever_rot
			{
				type = "rotation";
				source = "drezina_lever";
				selection = "lever";
				axis = "lever_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -22";
				angle1 = "rad 22";
			};

			class wheel_fl_rot
			{
				type = "rotation";
				source = "drezina_wheels";
				selection = "wheel_fl";
				axis = "axle_front";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 360";
			};
			class wheel_fr_rot: wheel_fl_rot
			{
				selection = "wheel_fr";
			};
			class wheel_rl_rot: wheel_fl_rot
			{
				selection = "wheel_rl";
				axis = "axle_rear";
			};
			class wheel_rr_rot: wheel_rl_rot
			{
				selection = "wheel_rr";
			};
		};
	};

	class rail_2m: Default {};
	class dispenser: Default {};
};
